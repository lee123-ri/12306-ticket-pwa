<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a5f9e">
  <title>火车票助手</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="title">火车票助手</div>
    <div class="actions">
      <button id="notifyBtn">开启通知</button>
      <button id="monitorBtn">监控</button>
    </div>
  </header>

  <main id="chat"></main>

  <footer>
    <form id="form">
      <input id="input" type="text" placeholder="如：明天北京到上海二等座" autocomplete="off">
      <button type="submit">发送</button>
    </form>
  </footer>

  <div class="mask" id="mask"></div>
  <div class="panel" id="monitorPanel">
    <div class="head">
      <span>监控任务</span>
      <button class="close" id="monitorClose">×</button>
    </div>
    <div class="body" id="monitorBody"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
